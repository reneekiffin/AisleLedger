# Publishes the app to GitHub Pages on every push.
#
# `configure-pages` with `enablement: true` switches Pages on the first time
# this runs, so there is nothing to click in Settings. If your org or account
# blocks that, turn Pages on manually (Settings -> Pages -> Deploy from a
# branch -> /docs) and the committed docs/ folder serves the same site.
name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/aisle-ledger-pwa-l6zu2v]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue them instead of cancelling a live one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Built here rather than deploying the committed docs/ folder, so the
      # live site can never be a stale build someone forgot to regenerate.
      - run: npm run build:pages

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4

      # deploy-pages reports success for its own deployment, which is not the
      # same as the URL serving it. This project hit exactly that: with the
      # Pages source still set to a branch, GitHub's own builder republished
      # the repo root seconds later, so the live page served Vite's source
      # template - an empty #root and a /src/main.jsx no browser can run - and
      # every run was still green. Assert the real page instead.
      - name: Verify the live URL serves the built app
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -uo pipefail
          body=""
          for wait in 5 10 20 30 45 60; do
            sleep "$wait"
            body=$(curl -fsSL --max-time 30 "$PAGE_URL" || true)
            # The built page loads a hashed bundle; the source template loads
            # /src/main.jsx. Only one of those means a working site.
            if printf '%s' "$body" | grep -qE 'assets/index-[A-Za-z0-9_-]+\.js'; then
              echo "OK: $PAGE_URL is serving the built app."
              exit 0
            fi
            echo "Not live yet (waited ${wait}s), retrying..."
          done
          echo "::error::$PAGE_URL is not serving the built app."
          echo "--- what the URL actually returned ---"
          printf '%s' "$body" | head -c 1000
          exit 1
